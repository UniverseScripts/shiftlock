[project]
name = "shiftlock"
version = "0.1.0"
description = "Check whether your own prompts, tool calls and JSON outputs still work before you switch LLM models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoshio" }]
requires-python = ">=3.12"
keywords = ["llm", "model migration", "deprecation", "regression testing", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.11.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
shiftlock = "shiftlock.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real provider APIs and spends credit (opt-in)"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
